name: Next.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Acquisition and account tests
        run: |
          npm run test:acquisition
          npm run test:account

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e -- --workers=2
